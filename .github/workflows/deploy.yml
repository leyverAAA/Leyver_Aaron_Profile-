name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Habilita permisos de escritura para desplegar Pages
permissions:
  contents: read
  pages: write
  id-token: write

# No permite dos deploys concurrentes; en cola el último gana
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Corre antes del deploy: rutas absolutas, referencias rotas y anchas
    # inválidas rompen producción sin romper el build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar el sitio
        run: node scripts/check.mjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # public/ ya es el producto final: no hay build que ejecutar
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4